services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trustline}
      POSTGRES_USER: ${POSTGRES_USER:-trustline_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trustline_owner_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init/00-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  tests:
    build: ./backend
    profiles: ["test"]
    command: sh -c "alembic upgrade head && pytest"
    environment:
      DATABASE_URL: postgresql+asyncpg://trustline_app:trustline_app_password@postgres:5432/trustline_test
      TEST_DATABASE_URL: postgresql+asyncpg://trustline_app:trustline_app_password@postgres:5432/trustline_test
      EVALUATOR_DATABASE_URL: postgresql+asyncpg://trustline_evaluator:trustline_evaluator_password@postgres:5432/trustline_test
      MIGRATION_DATABASE_URL: postgresql+psycopg://trustline_owner:trustline_owner_password@postgres:5432/trustline_test
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: